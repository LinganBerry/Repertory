<!doctype html>
<html lang="es" data-tema="papel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esta página desafinó · Acordes y Tonos</title>
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="estilos.css">

<script src="404.js"></script>
</head>
<body class="perdida">
<main>
  <p class="cuatro" aria-hidden="true"><span>4</span><span class="cero">0</span><span>4</span></p>
  <h1>Esta página desafinó</h1>
  <p class="sub">Ese enlace no existe o se movió de lugar. Mientras vuelves, toca las teclas (sin sonido, solo para jugar).</p>
  <div class="teclado" role="group" aria-label="Teclado de piano de juguete">
    <button type="button" class="blanca" data-n="C" aria-label="Tecla C"><span>C</span></button>
    <button type="button" class="blanca" data-n="D" aria-label="Tecla D"><span>D</span></button>
    <button type="button" class="blanca" data-n="E" aria-label="Tecla E"><span>E</span></button>
    <button type="button" class="blanca" data-n="F" aria-label="Tecla F"><span>F</span></button>
    <button type="button" class="blanca" data-n="G" aria-label="Tecla G"><span>G</span></button>
    <button type="button" class="blanca" data-n="A" aria-label="Tecla A"><span>A</span></button>
    <button type="button" class="blanca" data-n="B" aria-label="Tecla B"><span>B</span></button>
    <button type="button" class="negra n1" data-n="C#" aria-label="Tecla C sostenido"></button>
    <button type="button" class="negra n2" data-n="D#" aria-label="Tecla D sostenido"></button>
    <button type="button" class="negra n4" data-n="F#" aria-label="Tecla F sostenido"></button>
    <button type="button" class="negra n5" data-n="G#" aria-label="Tecla G sostenido"></button>
    <button type="button" class="negra n6" data-n="A#" aria-label="Tecla A sostenido"></button>
  </div>
  <p id="nota" class="nota" aria-live="polite">Toca una tecla</p>
  <p id="frase" class="a"></p>
  <p><a class="volver" href="/">← Volver al repertorio</a></p>
