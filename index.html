<!doctype html>
<html lang="es" data-tema="papel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repertorio</title>
<style>
  :root { --accent: #2b59c3; --serif: Georgia, "Times New Roman", serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[data-tema=papel] { --bg: #faf6ee; --ink: #2a2620; --muted: #7a7266; --line: #e4dccb; --fila: #f1eadb; --fila2: #fffdf8; --pl: 84%; --pt: #2a2620; --tit: var(--serif); }
  :root[data-tema=escenario] { --bg: #1c1c1e; --ink: #f1e9d8; --muted: #a39d90; --line: #38383b; --fila: #27272a; --fila2: #343438; --pl: 30%; --pt: #f1e9d8; --tit: var(--sans); }
  * { box-sizing: border-box; }
  body { font: 17px/1.4 var(--sans); max-width: 44rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; color: var(--ink); background: var(--bg); }
  html { background: var(--bg); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; }
  h1 { font: 700 1.8rem/1.2 var(--tit); margin: 0 0 .3rem; }
  #intro { color: var(--muted); margin: 0 0 1rem; }
  input, select, textarea, button { font: inherit; color: var(--ink); }
  input, select, textarea { font-size: 16px; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
  button { min-height: 44px; padding: .4rem .9rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; }
  :is(input, select, textarea, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #barra { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: .5rem 0 .6rem; border-bottom: 1px solid var(--line); }
  .busca { display: flex; align-items: center; gap: .6rem; }
  .busca input { flex: 1; min-width: 0; min-height: 48px; }
  .badge { flex: none; padding: .25rem .6rem; border: 1px solid var(--line); border-radius: 4px; font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .pastillas { display: flex; gap: .45rem; overflow-x: auto; padding: .6rem 0 .2rem; -webkit-overflow-scrolling: touch; }
  .pastillas button { flex: none; min-width: 48px; padding: .3rem .7rem; font-weight: 700; }
  .pastillas button[aria-pressed=true] { border: 2px solid var(--ink); }
  .tono { display: inline-flex; align-items: center; justify-content: center; min-width: 2.6rem; padding: .35rem .6rem; border-radius: 4px; font-weight: 700; color: var(--pt); background: hsl(var(--h, 0) var(--s, 0%) var(--pl)); }
  .tono small { font-size: .65em; font-weight: 600; margin-left: 1px; }
  .fila { display: flex; align-items: center; gap: .6rem; padding: .3rem 0; border-bottom: 1px solid var(--line); }
  .abrir { flex: 1; min-width: 0; display: block; text-align: left; border: 0; background: none; padding: .55rem 0; min-height: 56px; }
  .t { display: block; font: 700 1.2rem/1.25 var(--tit); }
  .a { display: block; font-size: .9rem; color: var(--muted); }
  body.fija { overflow: hidden; }
  #cancion { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); --z: 1; }
  .cbarra { position: sticky; top: 0; display: flex; gap: .4rem; padding: .5rem 1rem; background: var(--bg); border-bottom: 1px solid var(--line); }
  .cbarra .sp { flex: 1; }
  .ccuerpo { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 5rem; }
  .ccuerpo h2 { font: 700 calc(1.8rem * var(--z))/1.2 var(--tit); margin: 0 0 .2rem; }
  .parte { margin: .9rem 0; padding: .6rem .8rem; border-left: 5px solid var(--line); background: var(--fila); }
  .parte.coro { background: var(--fila2); border-left-color: var(--ink); }
  .parte h3 { margin: 0 0 .4rem; font: 700 .85rem var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .parte h3 small { font-weight: 400; text-transform: none; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
  .chip { display: inline-flex; flex-direction: column; align-items: center; padding: .3rem .7rem; border: 1px solid var(--ink); border-radius: 3px; font: 700 calc(1.3rem * var(--z))/1.2 ui-monospace, Menlo, Consolas, monospace; }
  .barra { color: var(--muted); font-size: calc(1.5rem * var(--z)); padding: 0 .15rem; }
  .pista { margin: .5rem 0 0; color: var(--muted); font-style: italic; font-size: calc(1rem * var(--z)); }
  .estrella { flex: none; min-width: 44px; padding: .2rem; border: 0; background: none; font-size: 1.3rem; }
  .vacio { padding: 1.5rem 0; color: var(--muted); }
  #pie { color: var(--muted); font-size: .9rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0 1rem; }
  .editor { border-left: 5px solid #d9a400; padding: .4rem 0 .4rem .9rem; margin: 1rem 0 1.2rem; font-size: 16px; }
  .editor label { display: inline-block; margin: .2rem .8rem .2rem 0; color: var(--muted); }
  .editor input, .editor select, .editor textarea { max-width: 100%; }
  .editor fieldset { margin: .8rem 0; border: 1px solid var(--line); border-radius: 4px; }
  .acciones { flex: none; display: flex; gap: .3rem; }
  .acciones button { min-height: 40px; padding: .2rem .6rem; font-size: .9rem; }
  .rom { font: 400 calc(.75rem * var(--z))/1.1 var(--sans); color: var(--muted); }
  #vaciar { min-height: 36px; font-size: .85rem; color: var(--muted); }
  @media print {
    header button, #barra, #editor, .cbarra, .estrella, .noimp { display: none !important; }
    :root[data-tema] { --bg: #fff; --ink: #000; --muted: #444; --line: #999; --fila: #fff; --fila2: #fff; }
    body.fija { overflow: visible; }
    body.fija header, body.fija #intro, body.fija #lista, body.fija hr, body.fija #pie { display: none; }
    #cancion { position: static; overflow: visible; }
    .parte { break-inside: avoid; }
  }
</style>
</head>
<body>
<header><h1 id="titulo"></h1><button id="tema" type="button"></button></header>
<p id="intro"></p>
<div id="editor"></div>
<div id="barra">
  <div class="busca"><input id="q" type="search" placeholder="Buscar canción o artista" autocomplete="off"><span id="cuenta" class="badge" aria-live="polite"></span></div>
  <div id="pastillas" class="pastillas"></div>
</div>
<main id="lista"></main>
<div id="cancion" hidden></div>
<hr>
<p id="pie"></p>
<p class="noimp"><button id="vaciar" type="button">Borrar copia guardada en este teléfono</button></p>

<script src="canciones.js"></script>
<script>
(() => {
  'use strict';

  const EDITOR = new URLSearchParams(location.search).has('editar');
  const NOTAS = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };

  const $ = id => document.getElementById(id);
  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids.flat().filter(k => k != null && k !== false));
    return n;
  };

  // --- tema (Papel / Escenario): arranca según el modo del teléfono y se recuerda ---
  const TEMA = 'repertorio-tema';
  const guardado = () => { try { return localStorage.getItem(TEMA); } catch (e) { return null; } };
  function aplicarTema(t) {
    document.documentElement.dataset.tema = t;
    $('tema').textContent = t === 'papel' ? 'Escenario' : 'Papel';
  }
  aplicarTema(guardado() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escenario' : 'papel'));
  $('tema').addEventListener('click', () => {
    const t = document.documentElement.dataset.tema === 'papel' ? 'escenario' : 'papel';
    try { localStorage.setItem(TEMA, t); } catch (e) { /* nada */ }
    aplicarTema(t);
  });

  // --- búsqueda: sin tildes ni signos; tolera pequeños errores (distancia de edición) ---
  const fichas = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  const distancia = (a, b) => {
    const fila = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      let previo = fila[0];
      fila[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const actual = fila[j];
        fila[j] = Math.min(fila[j] + 1, fila[j - 1] + 1, previo + (a[i - 1] === b[j - 1] ? 0 : 1));
        previo = actual;
      }
    }
    return fila[b.length];
  };
  const puntaje = (c, palabras) => {
    const textos = fichas(c.titulo + ' ' + c.artista);
    let total = 0;
    for (const w of palabras) {
      const tolerancia = w.length <= 3 ? 0 : w.length <= 6 ? 1 : 2;
      let mejor = Infinity;
      for (const t of textos) {
        if (t.startsWith(w)) mejor = Math.min(mejor, 0);
        else if (t.includes(w)) mejor = Math.min(mejor, 1);
        else {
          const d = Math.min(distancia(w, t), distancia(w, t.slice(0, w.length)));
          if (d <= tolerancia) mejor = Math.min(mejor, 1 + d);
        }
      }
      if (mejor === Infinity) return null;
      total += mejor;
    }
    return total;
  };

  // --- color por tono: misma nota = mismo matiz; el menor, más frío (hacia azul) y más apagado ---
  const TONO_RE = /^([A-G][#b]?)(m?)/;
  const posTono = k => {
    const m = TONO_RE.exec(k || '');
    return m ? NOTAS[m[1]] * 2 + (m[2] ? 1 : 0) : 99;
  };
  function colorear(nodo, tono) {
    const m = TONO_RE.exec(tono || '');
    if (!m) return nodo;
    let h = NOTAS[m[1]] * 30;
    if (m[2]) h = (h + (((220 - h + 540) % 360) - 180) * 0.2 + 360) % 360;
    nodo.style.setProperty('--h', Math.round(h));
    nodo.style.setProperty('--s', m[2] ? '22%' : '34%');
    return nodo;
  }
  const rotulo = t => { const m = TONO_RE.exec(t || ''); return m ? [m[1], m[2] && el('small', {}, 'm')] : [t || '—']; };
  const pastilla = t => colorear(el('span', { className: 'tono' }, ...rotulo(t)), t);

  const normalizar = d => {
    const x = clone(d || {});
    x.canciones = Array.isArray(x.canciones) ? x.canciones : [];
    return x;
  };
  let data = normalizar(null);
  const vista = { q: '', tono: '', fav: false };

  const tonosPresentes = () => [...new Set(data.canciones.map(c => c.tono).filter(Boolean))].sort((a, b) => posTono(a) - posTono(b));

  function visibles() {
    const palabras = fichas(vista.q);
    const filas = [];
    data.canciones.forEach((c, i) => {
      if (vista.tono && c.tono !== vista.tono) return;
      if (vista.fav && !favs.has(clave(c))) return;
      const p = puntaje(c, palabras);
      if (p !== null) filas.push({ c, i, p });
    });
    const porTitulo = (a, b) => a.c.titulo.localeCompare(b.c.titulo, 'es');
    return filas.sort(palabras.length ? (a, b) => a.p - b.p || porTitulo(a, b) : porTitulo);
  }

  function pastillas() {
    if (vista.tono && !tonosPresentes().includes(vista.tono)) vista.tono = '';
    const boton = (t, hijos, tono) => colorear(el('button', {
      type: 'button', 'aria-pressed': String(vista.tono === t),
      onclick: () => { vista.tono = t; if (!t) vista.fav = false; render(); }
    }, ...hijos), tono);
    $('pastillas').replaceChildren(
      boton('', ['Todos']),
      el('button', { type: 'button', 'aria-pressed': String(vista.fav), 'aria-label': 'Solo favoritos', onclick: () => { vista.fav = !vista.fav; render(); } }, '★'),
      ...tonosPresentes().map(t => { const b = boton(t, rotulo(t), t); b.classList.add('tono'); return b; }));
  }

  // --- favoritos y ajustes: por dispositivo (localStorage), sin cuentas ni cookies ---
  const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* nada */ } };
  const favs = new Set(leer('repertorio-fav', []));
  const clave = c => c.titulo + '|' + (c.artista || '');
  const alternarFav = c => { const k = clave(c); favs.has(k) ? favs.delete(k) : favs.add(k); guardar('repertorio-fav', [...favs]); };
  let zoom = Math.min(1.9, Math.max(.85, Number(leer('repertorio-zoom', 1)) || 1));
  let actual = null;

  // Pantalla encendida mientras la canción está abierta (si el navegador lo permite).
  let candado = null;
  async function pantallaEncendida() {
    try {
      if (candado || !('wakeLock' in navigator)) return;
      candado = await navigator.wakeLock.request('screen');
      candado.addEventListener('release', () => { candado = null; });
    } catch (e) { /* nada */ }
  }
  const soltarPantalla = () => { try { candado && candado.release(); } catch (e) { /* nada */ } candado = null; };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && actual) pantallaEncendida(); });

  // --- pantalla completa por canción: capa propia, el gesto de atrás del teléfono la cierra ---
  // Compás marcado a mano con "|"; sin barras, los acordes van seguidos.
  // Número romano = distancia del acorde al tono (de la parte, si tiene uno propio). Aproximado a propósito:
  // minúscula si el acorde es menor, ♭/♯ en grados alterados, extensiones (7, sus4...) se conservan.
  const NUM_MAY = ['I', '♭II', 'II', '♭III', 'III', 'IV', '♭V', 'V', '♭VI', 'VI', '♭VII', 'VII'];
  const NUM_MEN = ['I', '♭II', 'II', 'III', '♯III', 'IV', '♯IV', 'V', 'VI', '♯VI', 'VII', '♯VII'];
  function romano(acorde, tono) {
    const k = TONO_RE.exec(tono || ''), m = /^([A-G][#b]?)(.*)$/.exec(acorde);
    if (!k || !m || NOTAS[m[1]] == null) return '';
    let ext = m[2].split('/')[0];
    const menor = /^m(?!aj)/.test(ext) || /^dim/.test(ext);
    ext = ext.replace(/^m(?!aj)/, '').replace(/^dim/, '°');
    let n = (k[2] ? NUM_MEN : NUM_MAY)[(NOTAS[m[1]] - NOTAS[k[1]] + 12) % 12];
    if (menor) n = n.replace(/[IV]+/, x => x.toLowerCase());
    return n + ext;
  }
  const compases = prog => prog.split('|').map(g => g.trim().split(/\s+/).filter(t => t && t !== '-')).filter(g => g.length);

  function parte(p) {
    const hijos = [];
    compases(p.prog).forEach((g, i) => {
      if (i) hijos.push(el('span', { className: 'barra' }, '|'));
      g.forEach(a => hijos.push(el('span', { className: 'chip' }, el('b', {}, a), el('i', { className: 'rom' }, romano(a, p.tono || actual.tono)))));
    });
    return el('section', { className: 'parte' + (norm(p.nombre).trim() === 'coro' ? ' coro' : '') },
      el('h3', {}, p.nombre || '', p.tono && el('small', {}, ' · ' + p.tono)),
      el('div', { className: 'chips' }, ...hijos),
      p.pista && el('p', { className: 'pista' }, p.pista));
  }

  function mostrar() {
    const c = actual, caja = $('cancion');
    const esFav = favs.has(clave(c));
    const partes = (c.partes || []).filter(p => p.prog);
    caja.replaceChildren(
      el('div', { className: 'cbarra' },
        el('button', { type: 'button', onclick: () => history.back() }, '← Volver'),
        el('span', { className: 'sp' }),
        el('button', { type: 'button', 'aria-label': 'Letra más chica', onclick: () => cambiarZoom(-.15) }, 'A−'),
        el('button', { type: 'button', 'aria-label': 'Letra más grande', onclick: () => cambiarZoom(.15) }, 'A+'),
        el('button', { type: 'button', 'aria-pressed': String(esFav), 'aria-label': 'Favorito', onclick: () => { alternarFav(c); mostrar(); render(); } }, esFav ? '★' : '☆')),
      el('div', { className: 'ccuerpo' },
        el('h2', {}, c.titulo),
        el('p', { className: 'a' }, [c.artista, c.nota].filter(Boolean).join(' · ')),
        pastilla(c.tono),
        ...(partes.length ? partes.map(parte) : [el('p', { className: 'vacio' }, 'Aún no hay partes ni acordes para esta canción.')]),
        el('p', { className: 'noimp' }, el('button', { type: 'button', onclick: () => print() }, 'Imprimir'))));
    caja.style.setProperty('--z', zoom);
    caja.hidden = false;
    document.body.classList.add('fija');
  }

  function cambiarZoom(d) {
    zoom = Math.min(1.9, Math.max(.85, Math.round((zoom + d) * 100) / 100));
    guardar('repertorio-zoom', zoom);
    $('cancion').style.setProperty('--z', zoom);
  }

  function abrirCancion(c) {
    actual = c;
    history.pushState({ cancion: true }, '');
    mostrar();
    pantallaEncendida();
  }
  function cerrarCancion() {
    actual = null;
    $('cancion').hidden = true;
    document.body.classList.remove('fija');
    soltarPantalla();
  }
  window.addEventListener('popstate', () => { if (actual) cerrarCancion(); });

  function fila({ c, i }) {
    const cuerpo = el('button', { type: 'button', className: 'abrir', onclick: () => abrirCancion(c) },
      el('span', { className: 't' }, c.titulo),
      c.artista && el('span', { className: 'a' }, c.artista),
      c.nota && el('span', { className: 'a' }, c.nota));
    const esFav = favs.has(clave(c));
    const estrella = el('button', { type: 'button', className: 'estrella', 'aria-pressed': String(esFav), 'aria-label': 'Favorito', onclick: () => { alternarFav(c); render(); } }, esFav ? '★' : '☆');
    return [el('div', { className: 'fila' }, cuerpo, estrella, pastilla(c.tono), EDITOR && app.acciones && app.acciones(i))];
  }

  function render() {
    document.title = data.nombre || 'Repertorio';
    $('titulo').textContent = data.nombre || 'Repertorio';
    $('intro').textContent = data.intro || '';
    $('pie').textContent = data.actualizado ? 'Actualizado: ' + data.actualizado : '';
    pastillas();
    const rows = visibles();
    $('cuenta').textContent = `${rows.length} de ${data.canciones.length}`;
    $('lista').replaceChildren(...(rows.length
      ? rows.flatMap(fila)
      : [el('p', { className: 'vacio' }, 'No hay canciones con esos filtros.')]));
  }

  $('q').addEventListener('input', e => { vista.q = e.target.value; render(); });

  // Interfaz que usa editor.js (solo se carga con ?editar)
  const app = window.RepertorioApp = {
    el, norm, render,
    get data() { return data; },
    set data(d) { data = d; render(); },
    acciones: null
  };

  // Datos en el servidor (/api/canciones); si no responde, la copia incluida (canciones.js).
  async function cargar() {
    $('cuenta').textContent = '…';
    let d = window.REPERTORIO;
    try {
      const r = await (EDITOR ? fetch('/api/canciones?fresco=1', { cache: 'no-store' }) : fetch('/api/canciones'));
      if (r.ok) d = await r.json();
    } catch (e) { /* sin servidor: se usa la copia del sitio */ }
    data = normalizar(d);
    render();
    if (EDITOR) document.head.append(el('script', { src: 'editor.js' }));
  }
  // Offline: sw.js guarda la página y las canciones; se actualizan al abrir con internet.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { /* sin offline */ });
  $('vaciar').addEventListener('click', async () => {
    if (!confirm('¿Borrar la copia guardada? Hará falta internet para volver a abrir la página. Tus favoritos se conservan.')) return;
    try {
      for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) { /* nada */ }
    location.reload();
  });
  cargar();
})();
</script>
</body>
</html>
